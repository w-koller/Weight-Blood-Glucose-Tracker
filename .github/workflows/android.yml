name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Test, lint and build the debug APK
        run: ./gradlew :domain:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            domain/build/reports/
            app/build/reports/
          if-no-files-found: ignore

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: weight-glucose-tracker-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Build the signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          WGT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WGT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WGT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          WGT_KEYSTORE_PATH="$RUNNER_TEMP/release.jks" ./gradlew :app:assembleRelease --console=plain
          rm "$RUNNER_TEMP/release.jks"

      - name: Upload the release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: weight-glucose-tracker-release
          path: app/build/outputs/apk/release/*.apk
