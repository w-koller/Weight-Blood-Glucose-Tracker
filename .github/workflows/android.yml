name: Android CI

on:
  push:
    branches: ["**"]
    # A tag such as v1.0.0 also publishes the signed APK as a GitHub Release.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check that strings.xml was generated from tools/strings_*.py
        run: |
          python3 tools/gen_strings.py
          git diff --exit-code app/src/main/res/values/strings.xml

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Test, lint and build the debug APK
        run: ./gradlew :domain:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            domain/build/reports/
            app/build/reports/
          if-no-files-found: ignore

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: weight-glucose-tracker-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Build the signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          WGT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WGT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WGT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          WGT_KEYSTORE_PATH="$RUNNER_TEMP/release.jks" ./gradlew :app:assembleRelease --console=plain
          rm "$RUNNER_TEMP/release.jks"

      - name: Upload the release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: weight-glucose-tracker-release
          path: app/build/outputs/apk/release/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the app's version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The build job made and signed the APK. Without the signing secrets there is nothing to publish, so this fails.
      - name: Fetch the signed release APK
        run: gh run download "$GITHUB_RUN_ID" --name weight-glucose-tracker-release --dir apk

      - name: Create the GitHub Release
        run: |
          apk="weight-glucose-tracker-$VERSION.apk"
          mv apk/*.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          # The notes are the section whose heading is exactly the version, so 1.0.0 does not pick up 1.0.0-rc.1's.
          awk -v heading="## $VERSION" '$0 == heading { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
          # A version with a suffix, such as 1.0.0-rc.1, is published as a pre-release.
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" --title "Weight & Glucose Tracker $VERSION" --notes-file notes.md $prerelease
